<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Virdant Playground</title>
  <link rel="icon" type="image/svg+xml" href="../_static/virdant-logo-white-round.svg" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app">
    <div id="left">
      <div id="filesidebar">
        <div id="projectbar">
          <select id="project" title="Project"></select>
          <button id="addproject" title="New project">+</button>
          <button id="removeproject" title="Delete this project">✕</button>
        </div>
        <div id="filesidebar-header">
          <span>FILES</span>
          <button id="addfile" title="Add a file">+</button>
        </div>
        <ul id="filelist"></ul>
      </div>
      <div id="editorhost"></div>
    </div>

    <div id="splitter" title="Drag to resize"></div>

    <div id="right">
      <div id="tabs">
        <button class="tab active" id="tab-errors" data-tab="errors">Errors <span id="errcount"></span></button>
        <button class="tab" id="tab-console" data-tab="console">Console</button>
      </div>
      <div id="errorpanel" class="panel"></div>
      <div id="consolepanel" class="panel" hidden>
        <div id="terminal"></div>
      </div>
    </div>

    <div id="bottombar">
      <button id="run">Run</button>
      <button id="stop" hidden>Stop</button>
      <label class="keymap-label" for="keymap">Keys</label>
      <select id="keymap">
        <option value="default">Default</option>
        <option value="vim">Vim</option>
      </select>
      <button id="settings">Settings</button>
      <span id="fpsreadout"></span>
      <button id="themetoggle" class="dark-mode-toggle-btn" aria-label="Toggle dark mode" title="Toggle dark mode">
        <svg class="dm-sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16">
          <path fill="currentColor" d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58a.996.996 0 0 0-1.41 0 .996.996 0 0 0 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37a.996.996 0 0 0-1.41 0 .996.996 0 0 0 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0a.996.996 0 0 0 0-1.41l-1.06-1.06zm1.06-10.96a.996.996 0 0 0 0-1.41.996.996 0 0 0-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36a.996.996 0 0 0 0-1.41.996.996 0 0 0-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/>
        </svg>
        <svg class="dm-moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" style="display:none">
          <path fill="currentColor" d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/>
        </svg>
      </button>
    </div>
  </div>

  <div id="settingsmodal" hidden>
    <div id="settingsbox">
      <h2>Settings</h2>
      <label>
        <span>Top module</span>
        <input id="set-top" type="text" spellcheck="false" />
      </label>
      <label class="check">
        <input id="set-fpsnocap" type="checkbox" />
        <span>Disable real-time pacing (<code>--fps-no-cap</code>)</span>
      </label>
      <label class="check">
        <input id="set-showfps" type="checkbox" />
        <span>Display average clock frequency (fps)</span>
      </label>
      <label class="check">
        <input id="set-localecho" type="checkbox" />
        <span>Local echo (for designs that don't echo input)</span>
      </label>
      <div class="settings-field">
        <span>SPI flash image</span>
        <div id="set-flash">
          <div id="set-flash-drop" title="Drag & drop a .bin file here, or click to browse">
            <span id="set-flash-empty">Drop a .bin file here, or click to browse</span>
            <span id="set-flash-info" hidden></span>
          </div>
          <button id="set-flash-unload" hidden title="Forget the loaded flash image">Unload</button>
          <select id="set-flash-preset" title="Prepopulated flash binaries">
            <option value="">Preset flash images…</option>
          </select>
          <input id="set-flash-file" type="file" accept=".bin,application/octet-stream" hidden />
        </div>
        <span class="flash-hint">Takes effect at the next Run (the flash is not reset mid-simulation).</span>
      </div>
      <div id="settingsbuttons">
        <button id="set-reset">Reset files to default</button>
        <button id="set-close">Close</button>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
