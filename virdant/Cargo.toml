[package]
name = "virdant"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
bstr = "1.12.0"
colored = "3.1.1"
indexmap = "2.13.0"
json = "0.12.4"
lalrpop-util = { version = "0.23.1", features = ["lexer"], git = "https://github.com/virdant-lang/lalrpop" }
logos = "0.15.1"
paste = "1.0.15"
serde = { version = "1", features = ["derive"] }

[build-dependencies]
lalrpop = { version = "0.23.1", git = "https://github.com/virdant-lang/lalrpop" }
