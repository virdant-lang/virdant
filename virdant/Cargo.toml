[package]
name = "virdant"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
bstr = "1.12.0"
colored = "3.1.1"
indexmap = "2.13.0"
json = "0.12.4"
lalrpop-util = { version = "0.23.1", features = ["lexer"], git = "https://github.com/virdant-lang/lalrpop" }
logos = "0.15.1"
paste = "1.0.15"
serde = { version = "1", features = ["derive"] }
cranelift-codegen = { version = "=0.135.0", optional = true }
cranelift-frontend = { version = "=0.135.0", optional = true }
cranelift-jit = { version = "=0.135.0", optional = true }
cranelift-module = { version = "=0.135.0", optional = true }
cranelift-native = { version = "=0.135.0", optional = true }

[build-dependencies]
lalrpop = { version = "0.23.1", git = "https://github.com/virdant-lang/lalrpop" }

[features]
# In-process simulator phase-attribution counters (see
# `virdant/src/sim/profile.rs` and `sim-bench/README.md`).  Compiles
# out to zero cost when off.
sim-profile = []

# Cranelift JIT backend for replay-phase evaluation (JIT v2): compiles
# each qualifying deep-cycle replay phase to ONE native function that
# evaluates all of the phase's drivers in a single call, reading input
# bits directly from the state's narrow-value store (see
# `virdant/src/sim/vm/jit.rs`).  Commit logic stays in Rust.  Phases
# the translator cannot lower keep the per-driver interpreter.
# Pinned to 0.135: 0.137 requires rustc 1.97 (repo toolchain is
# 1.95), and 0.135 had zero API drift for this surface.
jit = ["dep:cranelift-codegen", "dep:cranelift-frontend", "dep:cranelift-jit", "dep:cranelift-module", "dep:cranelift-native"]
