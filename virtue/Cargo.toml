[package]
name = "virtue"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

# The test runner is a pure orchestrator: it links nothing from the
# compiler.  Every test is a subprocess of `target/release/vir` (plus
# iverilog / verilator for the sim suite), run with the same commands
# and exit-code contracts the per-directory Makefiles used before the
#
# `virtue --filecheck <check-file>` is the standalone FileCheck
# matcher (formerly the `filecheck` binary in the `virdant` crate);
# the runner itself uses the same library in-process to validate
# CHECK directives against captured test output.

[dependencies]
clap = { version = "4.5.46", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
toml = { version = "1.1.0" }

[[bin]]
name = "virtue"
path = "src/main.rs"

# Compatibility shim: a standalone `filecheck <check-file>` binary,
# equivalent to `virtue --filecheck`; also what `make install` copies.
[[bin]]
name = "filecheck"
path = "src/bin/filecheck.rs"
