<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 250" width="440" height="250" role="img" aria-label="Block diagram of the ShiftReg module: load_value enters from the top, shift_in enters from the left, shift_out exits to the right, and value exits from the bottom">
  <defs>
    <marker id="virdant-shiftreg-arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" class="shiftreg-arrowhead"/>
    </marker>
  </defs>
  <style>
    .virdant-shiftreg-svg {
      font-family: "Nunito", sans-serif;
      font-weight: 600;
      font-size: 17px;
      fill: var(--text-main, #333);
    }
    .virdant-shiftreg-svg .shiftreg-port {
      font-family: "Fira Mono", monospace;
      font-weight: 400;
      font-size: 14px;
      fill: var(--text-main, #333);
    }
    .virdant-shiftreg-svg .shiftreg-box {
      fill: var(--bg-page, #ffffff);
      fill-opacity: 0;
      stroke: var(--text-main, #333);
      stroke-width: 2;
    }
    .virdant-shiftreg-svg .shiftreg-wire {
      stroke: var(--text-main, #333);
      stroke-opacity: 0.6;
      stroke-width: 1.5;
      fill: none;
      marker-end: url(#virdant-shiftreg-arrowhead);
    }
    .shiftreg-arrowhead {
      fill: var(--text-main, #333);
    }
  </style>
  <g class="virdant-shiftreg-svg">

    <!-- Module box -->
    <rect class="shiftreg-box" x="160" y="85" width="120" height="80" rx="6" ry="6"/>
    <text x="220" y="130" text-anchor="middle">ShiftReg</text>

    <!-- load_value: top, into the box -->
    <line class="shiftreg-wire" x1="220" y1="42" x2="220" y2="80"/>
    <text class="shiftreg-port" x="220" y="28" text-anchor="middle">load_value</text>

    <!-- shift_in: left, into the box -->
    <line class="shiftreg-wire" x1="105" y1="125" x2="155" y2="125"/>
    <text class="shiftreg-port" x="95" y="130" text-anchor="end">shift_in</text>

    <!-- shift_out: right, out of the box -->
    <line class="shiftreg-wire" x1="285" y1="125" x2="335" y2="125"/>
    <text class="shiftreg-port" x="345" y="130" text-anchor="start">shift_out</text>

    <!-- value: bottom, out of the box -->
    <line class="shiftreg-wire" x1="220" y1="170" x2="220" y2="208"/>
    <text class="shiftreg-port" x="220" y="232" text-anchor="middle">value</text>

  </g>
</svg>
