<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 292 176" width="292" height="176" role="img" aria-label="Vertical addition for the four binary cases of the HalfAdder, annotated with a, b, carry_out, and sum">
  <defs>
    <marker id="virdant-add-arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" class="add-arrowhead"/>
    </marker>
  </defs>
  <style>
    .virdant-adder-svg {
      font-family: "Nunito", sans-serif;
      font-weight: 600;
      font-size: 17px;
      fill: var(--text-main, #333);
    }
    .virdant-adder-svg .adder-cell text {
      text-anchor: end;
      fill: var(--text-main, #333);
    }
    .virdant-adder-svg .adder-cell .separator {
      stroke: var(--text-main, #333);
      stroke-width: 2;
    }
    .virdant-adder-svg .add-label {
      font-family: "Fira Mono", monospace;
      font-weight: 100;
      font-size: 14px;
      fill: var(--text-main, #333);
      fill-opacity: 0.8;
      text-anchor: start;
    }
    .virdant-adder-svg .add-arrow {
      stroke: var(--text-main, #333);
      stroke-opacity: 0.55;
      stroke-width: 1.2;
      fill: none;
    }
    .add-arrowhead {
      fill: var(--text-main, #333);
    }
  </style>
  <g class="virdant-adder-svg">

    <!-- Row 0, Col 0: 0 + 0 = 00 -->
    <g class="adder-cell" transform="translate(34, 12)">
      <text x="36" y="14">0</text>
      <text class="operator" x="11" y="35">+</text>
      <text x="36" y="35">0</text>
      <line class="separator" x1="-3" y1="43" x2="40" y2="43" />
      <text x="36" y="65">00</text>
    </g>

    <!-- Row 0, Col 1: 0 + 1 = 01 -->
    <g class="adder-cell" transform="translate(150, 12)">
      <text x="36" y="14">0</text>
      <text class="operator" x="11" y="35">+</text>
      <text x="36" y="35">1</text>
      <line class="separator" x1="-3" y1="43" x2="40" y2="43" />
      <text x="36" y="65">01</text>
    </g>

    <!-- Row 1, Col 0: 1 + 0 = 01 -->
    <g class="adder-cell" transform="translate(34, 106)">
      <text x="36" y="14">1</text>
      <text class="operator" x="11" y="35">+</text>
      <text x="36" y="35">0</text>
      <line class="separator" x1="-3" y1="43" x2="40" y2="43" />
      <text x="36" y="65">01</text>
    </g>

    <!-- Row 1, Col 1: 1 + 1 = 10 -->
    <g class="adder-cell" transform="translate(150, 106)">
      <text x="36" y="14">1</text>
      <text class="operator" x="11" y="35">+</text>
      <text x="36" y="35">1</text>
      <line class="separator" x1="-3" y1="43" x2="40" y2="43" />
      <text x="36" y="65">10</text>
    </g>

    <!-- Annotation: labels to the right of the upper-right quadrant -->
    <g class="add-annotation">
      <text class="add-label" x="206" y="26">a</text>
      <text class="add-label" x="206" y="47">b</text>
      <text class="add-label" x="206" y="75">sum</text>
      <text class="add-label" x="206" y="96">carry_out</text>
      <line class="add-arrow" x1="204" y1="20" x2="189" y2="20" marker-end="url(#virdant-add-arrowhead)" />
      <line class="add-arrow" x1="204" y1="41" x2="189" y2="41" marker-end="url(#virdant-add-arrowhead)" />
      <line class="add-arrow" x1="204" y1="71" x2="189" y2="71" marker-end="url(#virdant-add-arrowhead)" />
      <path class="add-arrow" d="M 204,92 L 186,92 C 180,92 176.2,91.25 174.8,86 L 172.8,78.5" marker-end="url(#virdant-add-arrowhead)" />
    </g>

  </g>
</svg>
