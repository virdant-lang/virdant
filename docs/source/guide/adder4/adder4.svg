<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 12 351 234" width="351" height="234" role="img" aria-label="Vertical addition 1011 + 1010 = 10101 for the Adder4, annotated with a[3..0], b[3..0], sum[3..0], carry_in, and carry_out">
  <defs>
    <marker id="virdant-adder4-arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" class="add-arrowhead"/>
    </marker>
  </defs>
  <style>
    .virdant-adder-svg {
      font-family: "Nunito", sans-serif;
      font-weight: 600;
      font-size: 22px;
      fill: var(--text-main, #333);
    }
    /* Digits carry a halo in the page background colour (painted under
       the glyph via paint-order), so an arrow passing behind a digit
       appears to break around it instead of overlapping it. */
    .virdant-adder-svg .digit {
      text-anchor: middle;
      fill: var(--text-main, #333);
      stroke: var(--bg-page, #fff);
      stroke-width: 7px;
      stroke-linejoin: round;
      paint-order: stroke;
    }
    .virdant-adder-svg .carry {
      fill-opacity: 0.8;
    }
    .virdant-adder-svg .separator {
      stroke: var(--text-main, #333);
      stroke-width: 2.5;
      stroke-linecap: round;
    }
    .virdant-adder-svg .add-label {
      font-family: "Fira Mono", monospace;
      font-weight: 100;
      font-size: 14px;
      fill: var(--text-main, #333);
      fill-opacity: 0.8;
      text-anchor: start;
      /* Same background halo as the digits, so a line passing a label
         breaks around it instead of grazing it. */
      stroke: var(--bg-page, #fff);
      stroke-opacity: 1;
      stroke-width: 6px;
      stroke-linejoin: round;
      paint-order: stroke;
    }
    .virdant-adder-svg .add-label-mid { text-anchor: middle; }
    .virdant-adder-svg .add-label-end { text-anchor: end; }
    .virdant-adder-svg .add-arrow {
      stroke: var(--text-main, #333);
      stroke-opacity: 0.55;
      stroke-width: 1.2;
      fill: none;
    }
    .add-arrowhead {
      fill: var(--text-main, #333);
    }
  </style>
  <!-- Generated layout: digit columns at pitch 30px, rows at 34px.
       All labels sit outside the digit block: a[i] and b[i] in two lanes
       above, sum[i] below, carry_in right, carry_out left. -->
  <g class="virdant-adder-svg">
    <!-- Arrows first, so digits (with a page-coloured halo) sit on top:
         where a line passes behind a digit it visibly breaks. -->
    <line class="add-arrow" x1="280.0" y1="35.0" x2="280.0" y2="107.0" marker-end="url(#virdant-adder4-arrowhead)" />
    <line class="add-arrow" x1="234.0" y1="35.0" x2="250.0" y2="107.0" marker-end="url(#virdant-adder4-arrowhead)" />
    <line class="add-arrow" x1="188.0" y1="35.0" x2="220.0" y2="107.0" marker-end="url(#virdant-adder4-arrowhead)" />
    <line class="add-arrow" x1="142.0" y1="35.0" x2="190.0" y2="107.0" marker-end="url(#virdant-adder4-arrowhead)" />
    <line class="add-arrow" x1="259.0" y1="61.0" x2="280.0" y2="141.0" marker-end="url(#virdant-adder4-arrowhead)" />
    <line class="add-arrow" x1="216.7" y1="61.0" x2="250.0" y2="141.0" marker-end="url(#virdant-adder4-arrowhead)" />
    <line class="add-arrow" x1="174.5" y1="61.0" x2="220.0" y2="141.0" marker-end="url(#virdant-adder4-arrowhead)" />
    <line class="add-arrow" x1="128.0" y1="61.0" x2="190.0" y2="141.0" marker-end="url(#virdant-adder4-arrowhead)" />
    <line class="add-arrow" x1="313.6" y1="224.0" x2="283.4" y2="210.0" marker-end="url(#virdant-adder4-arrowhead)" />
    <line class="add-arrow" x1="261.2" y1="224.0" x2="251.1" y2="210.0" marker-end="url(#virdant-adder4-arrowhead)" />
    <line class="add-arrow" x1="208.8" y1="224.0" x2="218.9" y2="210.0" marker-end="url(#virdant-adder4-arrowhead)" />
    <line class="add-arrow" x1="156.4" y1="224.0" x2="186.6" y2="210.0" marker-end="url(#virdant-adder4-arrowhead)" />
    <line class="add-arrow" x1="312.0" y1="86.0" x2="291.0" y2="86.0" marker-end="url(#virdant-adder4-arrowhead)" />
    <line class="add-arrow" x1="128.0" y1="198.0" x2="149.0" y2="198.0" marker-end="url(#virdant-adder4-arrowhead)" />

    <!-- labels -->
    <text class="add-label add-label-mid" x="280.0" y="30.0">a[0]</text>
    <text class="add-label add-label-mid" x="234.0" y="30.0">a[1]</text>
    <text class="add-label add-label-mid" x="188.0" y="30.0">a[2]</text>
    <text class="add-label add-label-mid" x="142.0" y="30.0">a[3]</text>
    <text class="add-label add-label-mid" x="259.0" y="56.0">b[0]</text>
    <text class="add-label add-label-mid" x="216.7" y="56.0">b[1]</text>
    <text class="add-label add-label-mid" x="174.5" y="56.0">b[2]</text>
    <text class="add-label add-label-mid" x="128.0" y="56.0">b[3]</text>
    <text class="add-label add-label-mid" x="322.0" y="238.0">sum[0]</text>
    <text class="add-label add-label-mid" x="264.0" y="238.0">sum[1]</text>
    <text class="add-label add-label-mid" x="206.0" y="238.0">sum[2]</text>
    <text class="add-label add-label-mid" x="148.0" y="238.0">sum[3]</text>
    <text class="add-label" x="316.0" y="90.0">carry_in</text>
    <text class="add-label add-label-end" x="124.0" y="202.0">carry_out</text>

    <!-- digits -->
    <text class="digit carry" x="160" y="92">1</text>
    <text class="digit carry" x="220" y="92">1</text>
    <text class="digit carry" x="280" y="92">0</text>
    <text class="digit" x="190" y="126">1</text>
    <text class="digit" x="220" y="126">0</text>
    <text class="digit" x="250" y="126">1</text>
    <text class="digit" x="280" y="126">1</text>
    <text class="digit" x="128" y="160">+</text>
    <text class="digit" x="190" y="160">1</text>
    <text class="digit" x="220" y="160">0</text>
    <text class="digit" x="250" y="160">1</text>
    <text class="digit" x="280" y="160">0</text>
    <line class="separator" x1="116" y1="173" x2="292" y2="173" />
    <text class="digit" x="160" y="204">1</text>
    <text class="digit" x="190" y="204">0</text>
    <text class="digit" x="220" y="204">1</text>
    <text class="digit" x="250" y="204">0</text>
    <text class="digit" x="280" y="204">1</text>
  </g>
</svg>
