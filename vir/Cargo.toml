[package]
name = "vir"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"

[lib]
name = "vircommon"
path = "src/common.rs"

[dependencies]
virdant = { path = "../virdant" }

bstr = "1.12.0"
clap = { version = "4.5.46", features = ["derive", "string"] }
colored = "3.1.1"
indexmap = "2.13.0"
json = "0.12.4"
libc = "0.2"
nix = { version = "0.31.2", features = ["process", "term", "signal", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "=1.49.0", features = ["macros", "rt-multi-thread", "io-std", "sync"] }
tera = "1"
toml = "1.1.0"
tower-lsp = "0.20.0"

[[bin]]
name = "vir"
path = "src/vir/main.rs"

[[bin]]
name = "vir-lsp"
path = "src/virlsp/main.rs"

[[bin]]
name = "vir-format"
path = "src/format/main.rs"

[[bin]]
name = "vir-tutor"
path = "src/vir-tutor/main.rs"

[[bin]]
name = "vir-doc"
path = "src/doc/main.rs"

[[bin]]
name = "vir-inspect"
path = "src/inspect/main.rs"

[[bin]]
name = "vir-run-icarus"
path = "src/run_icarus/main.rs"

# The Virdant test runner (formerly the `virtue` crate): a pure
# orchestrator that links nothing from the compiler; see
# src/virtue/README.md.
[[bin]]
name = "vir-virtue"
path = "src/virtue/main.rs"

# Compatibility shim: a standalone FileCheck matcher, equivalent to
# `vir-virtue --filecheck`; also what `make install` copies.
[[bin]]
name = "vir-filecheck"
path = "src/filecheck/main.rs"
