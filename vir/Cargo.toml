[package]
name = "vir"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
virdant = { path = "../virdant" }

bstr = "1.12.0"
clap = { version = "4.5.46", features = ["derive"] }
colored = "3.1.1"
indexmap = "2.13.0"
json = "0.12.4"
nix = { version = "0.31.2", features = ["process"] }
serde_json = "1.0.149"
tokio = { version = "=1.49.0", features = ["macros", "rt-multi-thread", "io-std", "sync"] }
toml = "1.1.0"
tower-lsp = "0.20.0"

[[bin]]
name = "vir"
path = "src/vir/main.rs"

[[bin]]
name = "vir-lsp"
path = "src/virlsp/main.rs"

[[bin]]
name = "vir-format"
path = "src/format/main.rs"

[[bin]]
name = "vir-tutor"
path = "src/vir-tutor/main.rs"
