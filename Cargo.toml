[workspace]
resolver = "2"
members = ["virtue",
    "virdant", "vir",
]

# The simulator is allocation- and compute-bound; at the default
# dev opt-level 0 it runs ~10x slower than release. Optimize just the
# `virdant` library's dev builds (the simulator engine lives here); the
# `vir` binaries are CLI dispatch and stay at opt-level 0 to keep
# incremental compile times low. See TODO.md item 8 for the measurements.
[profile.dev.package.virdant]
opt-level = 2

# Release builds of `virtue` prioritize fast compilation over fast execution:
# opt-level 1 keeps basic optimization but compiles much faster, and
# codegen-units 256 maximizes parallel codegen at the cost of cross-unit
# inlining opportunities.
[profile.release.package.virtue]
opt-level = 1
codegen-units = 256
