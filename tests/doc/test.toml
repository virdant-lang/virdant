kind = "doc"
description = "This is a package-level docstring for the virdoc test."
expect_files = [
  "build/doc/index.html",
  "build/doc/top/index.html",
  "build/doc/top/Top.html",
  "build/doc/hierarchy.html",
]
grep = [
  { path = "build/doc/top/index.html", pattern = "package-level docstring" },
  { path = "build/doc/top/Top.html", pattern = "Top module" },
  { path = "build/doc/top/Top.html", pattern = "counter and blinking LED" },
  { path = "build/doc/top/Top.html", pattern = "Submodules" },
  { path = "build/doc/top/Top.html", pattern = "blinker" },
  { path = "build/doc/hierarchy.html", pattern = "blinker" },
  { path = "build/doc/hierarchy.html", pattern = "top::Blink" },
  { path = "build/doc/index.html", pattern = "Module hierarchy" },
  { path = "build/doc/builtin/Word.html", pattern = "is an n-bit value" },
  { path = "build/doc/top/Reading.html", pattern = "<h2>Slots</h2>" },
  { path = "build/doc/top/Reading.html", pattern = "slot-temperature" },
  { path = "build/doc/top/Reading.html", pattern = "The temperature, in hundredths of a degree Celsius." },
  { path = "build/doc/top/Reading.html", pattern = "The relative humidity, in percent." },
  { path = "build/doc/top/Shape.html", pattern = "<h2>Slots</h2>" },
  { path = "build/doc/top/Shape.html", pattern = "Circle(r : Word[8])" },
  { path = "build/doc/top/Shape.html", pattern = "A circle with the given radius." },
  { path = "build/doc/top/Shape.html", pattern = "The radius, in pixels." },
  { path = "build/doc/top/Shape.html", pattern = "A square with the given side length." },
  { path = "build/doc/top/Op.html", pattern = "<h2>Slots</h2>" },
  { path = "build/doc/top/Op.html", pattern = "Start = 0w2" },
  { path = "build/doc/top/Op.html", pattern = "Start a new conversion." },
  { path = "build/doc/top/Op.html", pattern = "Power down the device." },
  { path = "build/doc/top/Op.html", pattern = "The device wakes on the next `Start`." },
]
