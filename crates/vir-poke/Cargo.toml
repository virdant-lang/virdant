[package]
name = "vir-poke"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"

# The WASM-clean session + scripting engine (`vir_poke`): the
# `Session` over the `Sim` engine, the poke command language, and the
# script/assert driver (`driver`).  Builds unchanged for
# `wasm32-wasip1`/`wasip2` (wasmtime); the readline REPL is
# target-gated (see `driver.rs`) and degrades to the plain line loop
# under WASI.
[lib]
name = "vir_poke"
path = "src/lib.rs"

# The command-line interface: identical flags and behavior to the
# pre-split `vir-poke` binary.
[[bin]]
name = "vir-poke"
path = "src/main.rs"

[dependencies]
vir-common = { path = "../vir-common", features = ["compiler"] }
virdant = { path = "../../virdant" }

bstr = "1.12.0"
clap = { version = "4.5.46", features = ["derive", "string"] }
lalrpop-util = "0.23"
libc = "0.2"
serde_json = "1.0.149"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rustyline = "17"

[build-dependencies]
lalrpop = "0.23"
